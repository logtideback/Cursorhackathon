# Taste Supabase project configuration.
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "taste"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8081"
additional_redirect_urls = ["taste://", "exp://"]
enable_signup = true

[storage]
enabled = true
file_size_limit = "50MiB"
